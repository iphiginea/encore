name: Switch Encore to setlist proxy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Route setlist.fm through Cloudflare Worker
        run: python3 .github/scripts/switch_setlist_proxy.py

      - name: Commit proxy migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Route setlist.fm through secure proxy"
          git push
